[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Model monitoring for production ML: drift, data quality and delayed-label performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "typer>=0.12",
]
dev = [
    "pytest>=8",
]

[project.scripts]
driftwatch = "driftwatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
